<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090B"/>
      <stop offset="100%" style="stop-color:#18181B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="50%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="25%" r="55%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="75%" r="50%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0"/>
    </radialGradient>
    <filter id="glowText">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <ellipse cx="180" cy="180" rx="450" ry="350" fill="url(#glow1)"/>
  <ellipse cx="1020" cy="450" rx="400" ry="300" fill="url(#glow2)"/>
  <text x="600" y="140" font-size="96" font-weight="800" fill="#FAFAFA" text-anchor="middle" letter-spacing="12" filter="url(#glowText)">VENDORA</text>
  <text x="600" y="195" font-size="26" font-weight="300" fill="#10B981" text-anchor="middle" letter-spacing="6">Your Store. Your Brand. Your Future.</text>
  <rect x="420" y="235" width="360" height="56" fill="url(#accentGrad)" rx="12"/>
  <text x="600" y="274" font-size="24" font-weight="700" fill="#FAFAFA" text-anchor="middle">Start Selling — $15/mo</text>
  <line x1="200" y1="340" x2="1000" y2="340" stroke="#27272A" stroke-width="1"/>
  <text x="600" y="390" font-size="20" font-weight="500" fill="#A1A1AA" text-anchor="middle">Beats Shopify on Price • Better Features • Zero Compromise</text>
  <text x="600" y="430" font-size="17" font-weight="400" fill="#71717A" text-anchor="middle">5 Products • 2.7% Fees • Instant Capitec Payouts • 24/7 Support</text>
  <text x="600" y="520" font-size="15" font-weight="300" fill="#52525B" text-anchor="middle" letter-spacing="2">Join thousands of sellers building their empire with Vendora</text>
</svg>
