<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090B"/>
      <stop offset="100%" style="stop-color:#18181B"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="50%" style="stop-color:#34D399"/>
      <stop offset="100%" style="stop-color:#10B981"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)" rx="24"/>
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#10B981" stroke-width="2" rx="20" opacity="0.15"/>
  <text x="200" y="155" font-size="140" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">V</text>
  <text x="200" y="255" font-size="38" font-weight="700" fill="#FAFAFA" text-anchor="middle" letter-spacing="14">VENDORA</text>
  <rect x="100" y="280" width="200" height="3" fill="url(#textGrad)" rx="2"/>
  <text x="200" y="330" font-size="14" font-weight="300" fill="#71717A" text-anchor="middle" letter-spacing="5">E-COMMERCE PLATFORM</text>
</svg>
