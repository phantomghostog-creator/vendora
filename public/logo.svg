<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#34D399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)" rx="20"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#10B981" stroke-width="2" rx="16" opacity="0.3"/>
  <text x="200" y="170" font-family="Arial Black, sans-serif" font-size="120" font-weight="900" fill="url(#textGrad)" text-anchor="middle" filter="url(#glow)">V</text>
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="12">VENDORA</text>
  <rect x="100" y="285" width="200" height="3" fill="url(#textGrad)" rx="2"/>
  <text x="200" y="330" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle" letter-spacing="4">E-COMMERCE PLATFORM</text>
</svg>
